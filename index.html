<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120808">
<title>爽快ゾンビ無双</title>
<meta name="description" content="最初から最強・絶対に死なない。押しよせるゾンビの大群を、剣と銃と必殺技でなぎ倒す3Dアクション!">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ゾンビ無双">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:type" content="website">
<meta property="og:title" content="爽快ゾンビ無双">
<meta property="og:description" content="最初から最強・絶対に死なない。押しよせるゾンビの大群を、剣と銃と必殺技でなぎ倒す3Dアクション!">
<meta property="og:image" content="https://roguepink.github.io/sokai/ogp.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app"></div>

<div id="loading" class="overlay">読みこみ中…</div>

<div id="title" class="overlay hidden">
  <h1 class="logo"><span>爽快</span>ゾンビ無双</h1>
  <p class="lead">最初から最強。絶対に死なない。<br>押しよせるゾンビの大群を、なぎ倒せ!</p>
  <button id="btnPlay" class="big" type="button">あそぶ</button>
  <p class="howto">左で移動 ・ 右のボタンを押している間 撃ちつづける ・ 近くの敵は自動で斬る</p>
</div>

<div id="pauseMenu" class="overlay hidden">
  <h2>一時停止</h2>
  <button id="btnResume" class="big" type="button">つづける</button>
  <button id="btnQuit" type="button">おわる</button>
</div>

<div id="result" class="overlay hidden">
  <h2>けっか</h2>
  <p id="resultNew" class="newrec hidden">🏆 最高記録 更新!</p>
  <p class="res">スコア <b id="resultScore">0</b></p>
  <p class="res">倒したゾンビ <b id="resultKills">0</b> 体</p>
  <p class="res small">ベスト <b id="resultBest">0</b></p>
  <button id="btnAgain" class="big" type="button">もういっかい</button>
  <button id="btnTitle" type="button">タイトルへ</button>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<script>
  // 起動に失敗したときの案内(古いブラウザなど)
  window.addEventListener('error', function (e) {
    var l = document.getElementById('loading');
    if (l && !l.classList.contains('hidden')) l.textContent = 'うまく起動できませんでした。ブラウザを新しくするか、Chrome / Safari で開いてください。';
  });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
